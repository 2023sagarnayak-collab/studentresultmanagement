<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="header">

                <p class="eyebrow">
                    Student Result Management
                </p>

                <h1>
                    Enter Student Result
                </h1>

                <p class="subtitle">
                    Enter the student's name and marks
                    for all three subjects.
                </p>

            </div>

            <form action="/submit"
                  method="POST"
                  class="result-form">

                <!-- Student Name -->

                <div class="field">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Marks -->

                <div class="marks-grid">

                    <div class="field">

                        <label for="marks1">
                            Marks 1
                        </label>

                        <input
                            type="number"
                            id="marks1"
                            name="marks1"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="marks2">
                            Marks 2
                        </label>

                        <input
                            type="number"
                            id="marks2"
                            name="marks2"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="marks3">
                            Marks 3
                        </label>

                        <input
                            type="number"
                            id="marks3"
                            name="marks3"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>

                </div>


                <!-- Submit -->

                <button type="submit">
                    Submit Result
                </button>

            </form>

        </section>

    </main>

</body>
</html>
